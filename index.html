<!DOCTYPE html>
<html lang="kk">
<link rel="manifest" href="./manifest.json"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#009b90">
  <title>AI Көмекші</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #17243b;
      background: linear-gradient(145deg, #e8faf6, #edf4ff);
    }
    main {
      width: 100%;
      max-width: 460px;
      padding: 36px 24px;
      border: 1px solid #dce8ee;
      border-radius: 28px;
      background: white;
      text-align: center;
      box-shadow: 0 16px 50px #17334b12;
    }
    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      font-size: 44px;
      background: #102238;
      border: 3px solid #00a89a;
      border-radius: 26px;
    }
    h1 { margin: 0 0 12px; font-size: 32px; }
    p { color: #627187; line-height: 1.65; }
    .features {
      margin: 24px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .features span {
      padding: 9px 12px;
      border-radius: 12px;
      background: #f0f6fa;
      font-size: 14px;
    }
    .start {
      display: block;
      padding: 17px;
      border-radius: 15px;
      background: #009b90;
      color: white;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }
    .start:hover { background: #007f76; }
    .start:focus-visible {
      outline: 3px solid #1678d4;
      outline-offset: 4px;
    }
    .note { margin: 20px 0 0; font-size: 13px; }
    footer { margin-top: 24px; font-size: 12px; color: #78869a; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">🤖</div>
    <h1>AI Көмекші</h1>
    <p>Мұғалім мен мектеп жұмысына арналған<br>жасанды интеллект көмекшісі</p>

    <div class="features">
      <span>💬 ЖИ чат</span>
      <span>🏫 Мектеп</span>
      <span>📚 Мұғалім</span>
      <span>🎙️ Дауыс</span>
    </div>

    <a class="start"
       href="https://ai.studio/apps/84586bab-6763-4ff3-b0c9-78cd6dd949ad?fullscreenApplet=true">
      Көмекшіні ашу →
    </a>

    <p class="note">
      Көмекші Google AI Studio бетінде ашылады.
      Интернет қажет. Google аккаунтына кіру сұралуы мүмкін.
    </p>

    <footer>Қазақша және орысша</footer>
  </main>
</body>
</html>
